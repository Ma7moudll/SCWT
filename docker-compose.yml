# Ecolamp — standalone development stack (independent product).
# Ports chosen to avoid collisions with any other project on the same host.
#   API 8100 · AI 8052 · MQTT 1886 · PostgreSQL 55432
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ecolamp
      POSTGRES_PASSWORD: ecolamp
      POSTGRES_DB: ecolamp_db
    ports: ["55432:5432"]
  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf
    ports: ["1886:1886"]
  ai:
    build: ./ai-service
    ports: ["8052:8052"]
  backend:
    build: ./backend
    ports: ["8100:8000"]
    depends_on: [db, mqtt, ai]
