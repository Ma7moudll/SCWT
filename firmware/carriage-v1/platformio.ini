; Ecolamp Station — CARRIAGE firmware (independent product)
[env:carriage-v1]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
    pololu/VL53L1X@^1.3.1
    bogde/HX711@^0.7.5
    waspinator/AccelStepper@^1.64
